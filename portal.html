<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>LA GUEUZE — Portail</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap" id="p"><p class="muted">Vérification du lien…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config/supabase.js"></script>
<script>(async()=>{const p=document.getElementById('p'),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const c=window.GUEUZE_CONFIG,t=location.hash.slice(1);
if(!c||!t){p.innerHTML='<p class="err">Lien invalide.</p>';return}
const {data,error}=await supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:false}}).rpc('gueuze_qr_open',{tok:t});
if(error||!data){p.innerHTML='<p class="err">Lien expiré, révoqué ou invalide. Demande un nouveau QR à la production.</p>';return}
p.innerHTML=`<p class="sig">LA GUEUZE · by @hipo.reporter</p><h1>${e(data.production)}</h1><p class="muted">Accès temporaire — valable jusqu’au ${new Date(data.expires_at).toLocaleString('fr-FR')}</p>`+
(data.sheets.map(s=>{const k=s.content||{};return `<div class="card"><b>${e(s.shoot_date)} ${e(s.title)}</b>Convocation : ${e(k.call)||'—'}<br>Lieu : ${e(k.place)||'—'}<pre style="white-space:pre-wrap;font:inherit">${e(k.scenes)}</pre><i class="muted">${e(k.notes)}</i></div>`}).join('')||'<p class="muted">Aucune feuille publiée.</p>')})()</script></body></html>
