<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><meta name="apple-mobile-web-app-capable" content="yes">
<title>LA GUEUZE</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css?v=301"></head><body><div id="app"><p class="muted c">Chargement…</p></div>
<script>addEventListener('error',function(e){var a=document.getElementById('app');if(a&&/Chargement/.test(a.textContent))a.innerHTML='<p class="err c">Erreur : '+String(e.message||(e.target&&e.target.src)||'inconnue').replace(/</g,'&lt;')+'</p>'},true);
setTimeout(function(){var a=document.getElementById('app');if(a&&/Chargement/.test(a.textContent))a.innerHTML='<div class="c"><p class="err">Chargement trop long (cache ou réseau).</p><button onclick="(async()=>{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);location.reload()})()">Vider le cache et recharger</button></div>'},8000)</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config/supabase.js?v=301" onerror="window.GUEUZE_CONFIG=null"></script><script src="app.js?v=301"></script><script src="extras.js?v=301"></script></body></html>
